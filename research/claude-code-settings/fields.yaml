field_categories:
  - category: basic_info
    fields:
      - name: setting_name
        description: 설정 키/기능의 공식 명칭 (예. permissions, hooks, SKILL.md)
        detail_level: brief
        required: true
      - name: file_location
        description: 설정이 위치하는 파일/디렉토리 경로 (예. .claude/settings.json, CLAUDE.md, .claude/skills/*/SKILL.md)
        detail_level: brief
        required: true
      - name: official_doc_status
        description: 공식 문서 존재 여부와 링크 (code.claude.com/docs 등)
        detail_level: brief
        required: false
      - name: version_introduced
        description: 최초 도입 버전 및 날짜 (알 수 있는 경우, 예. v2.1.178, 2026-05)
        detail_level: brief
        required: false

  - category: scope_and_loading
    fields:
      - name: scope_layer
        description: 설정이 속하는 우선순위 계층 (managed > local > project > user, 또는 plugin 레이어) 및 병합/오버라이드 규칙
        detail_level: moderate
        required: false
      - name: loading_trigger
        description: 컨텍스트에 언제 어떻게 로드되는지 (세션 시작시 상시 로드 / 파일경로 매칭 / 모델이 description 보고 판단 / 슬래시 커맨드 호출 / 훅처럼 컨텍스트 밖에서 실행)
        detail_level: moderate
        required: false
      - name: context_cost
        description: 토큰 예산에 미치는 영향 - 상시 로드되어 컨텍스트를 차지하는지, on-demand로 필요할 때만 로드되는지
        detail_level: brief
        required: false

  - category: popularity_adoption
    fields:
      - name: adoption_evidence
        description: 커뮤니티 채택도를 보여주는 근거 (유명 dotfiles 레포, 블로그, GitHub trending, 공식 마켓플레이스 통계 등)
        detail_level: moderate
        required: false

  - category: recommended_config
    fields:
      - name: config_snippet
        description: 실제로 복사해 쓸 수 있는 추천 예시 설정 스니펫 (JSON/YAML/Markdown)
        detail_level: detailed
        required: true
      - name: determinism_vs_flexibility
        description: 코드로 강제되는 결정적(deterministic) 성격인지, 모델이 참고만 하는 권고적(advisory) 성격인지
        detail_level: brief
        required: false

  - category: best_practices
    fields:
      - name: best_practices
        description: 실제 적용시 권장되는 패턴과 이유
        detail_level: detailed
        required: false
      - name: anti_patterns
        description: 흔히 저지르는 실수나 피해야 할 안티패턴
        detail_level: moderate
        required: false
      - name: security_risk_level
        description: 안전/주의/위험 중 리스크 등급과 그 이유 (특히 권한 우회, 자동 실행 관련 설정에서 중요)
        detail_level: brief
        required: false

  - category: recent_changes
    fields:
      - name: recent_changes
        description: 최근 6개월(2026년 상반기) 내 추가/변경된 내용과 해당 버전/날짜
        detail_level: moderate
        required: false
      - name: lifecycle_status
        description: 현재 상태 - 정식(stable) / 실험적(experimental) / 지원중단 예정(deprecated) 등
        detail_level: brief
        required: false

uncertain: []
